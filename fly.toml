# fly.toml app configuration file generated for gas-backend-mvp on 2026-05-20T21:57:32-05:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'gas-backend-mvp'
primary_region = 'gru'

[deploy]
  release_command = "alembic upgrade head"

[build]

[env]
  APP_ENV = 'fly'
  APP_STORAGE_BACKEND = 'postgres'
  APP_VERSION = 'fly-mvp'
  PORT = '8080'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [http_service.concurrency]
    type = 'requests'
    hard_limit = 250
    soft_limit = 200

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/health'

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
